<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171033" />
    <meta name="description" content="투네랜드 인형뽑기 — 강냉이로 즐기는 3D 인형뽑기 미니게임" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌽%3C/text%3E%3C/svg%3E"
    />
    <!-- 투네랜드 톤앤매너: 둥근 느낌의 한글 폰트 (로딩 실패 시 시스템 한글 폰트로 대체) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap"
    />
    <title>투네랜드 인형뽑기</title>
    <script>
      ;(function () {
        function setRem() {
          var w = Math.min(document.documentElement.clientWidth, 768)
          document.documentElement.style.fontSize = (w / 375) * 16 + 'px'
        }
        setRem()
        window.addEventListener('resize', setRem)
        window.addEventListener('orientationchange', setRem)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
